<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Submit Rankings</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--teal:#00A89C;--teal2:#00C8BC;--teal-dark:#005f5a;--navy:#0d1a2b;--navy2:#0a1520;--chrome:#d0d8e0;--chrome2:#f0f4f8;--muted:#7a9ab0;--gold:#F5A623;--orange:#E8621A;--orange2:#F08030;--border-teal:rgba(0,168,156,0.35);--green:#22c55e;--red:#C0181A;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--navy2);color:var(--chrome2);font-family:'Barlow',sans-serif;min-height:100vh;}
.frame-line{position:fixed;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--teal),var(--orange),var(--teal));z-index:100;}
.frame-line-top{top:0;}.frame-line-bottom{bottom:0;}
.container{max-width:800px;margin:0 auto;padding:20px 16px 80px;}
.nav{display:flex;align-items:center;gap:10px;padding:10px 0 16px;}
.nav-back{color:var(--muted);font-size:12px;letter-spacing:2px;text-decoration:none;text-transform:uppercase;}
.nav-back:hover{color:var(--teal2);}
.header{text-align:center;margin-bottom:24px;}
.header-eyebrow{font-size:11px;letter-spacing:6px;color:var(--teal2);margin-bottom:6px;text-transform:uppercase;}
.header h1{font-family:'Anton',sans-serif;font-size:clamp(32px,7vw,52px);letter-spacing:2px;background:linear-gradient(160deg,#fff,var(--chrome));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}

/* OWNER SELECT */
.owner-section{background:rgba(10,21,32,0.9);border:1px solid var(--border-teal);border-radius:6px;padding:20px;margin-bottom:20px;}
.section-title{font-family:'Anton',sans-serif;font-size:16px;letter-spacing:3px;color:var(--teal2);margin-bottom:12px;}
.owner-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;}
.owner-btn{padding:10px 12px;background:rgba(255,255,255,0.04);border:1px solid var(--border-teal);border-radius:3px;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;transition:all 0.2s;text-align:left;}
.owner-btn:hover{border-color:var(--teal);color:var(--teal2);background:rgba(0,168,156,0.08);}
.owner-btn.selected{border-color:var(--gold);color:var(--gold);background:rgba(245,166,35,0.08);}
.owner-btn.submitted{border-color:var(--green);color:var(--green);background:rgba(34,197,94,0.06);}
.owner-btn.submitted::after{content:' ✓';}

/* FILTERS */
.filter-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
.filter-btn{padding:6px 14px;border-radius:20px;border:1px solid var(--border-teal);background:transparent;color:var(--muted);font-size:12px;letter-spacing:1px;cursor:pointer;font-family:'Anton',sans-serif;transition:all 0.2s;}
.filter-btn.active{border-color:var(--teal);color:var(--teal2);background:rgba(0,168,156,0.1);}
.search-input{flex:1;min-width:160px;padding:7px 12px;background:rgba(255,255,255,0.05);border:1px solid var(--border-teal);border-radius:3px;color:var(--chrome2);font-size:13px;outline:none;}
.search-input::placeholder{color:var(--muted);}

/* RANKING LIST */
.ranking-section{background:rgba(10,21,32,0.9);border:1px solid var(--border-teal);border-radius:6px;overflow:hidden;}
.ranking-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border-teal);background:rgba(0,168,156,0.04);}
.ranking-count{font-size:12px;color:var(--muted);letter-spacing:1px;}
.ranking-list{max-height:65vh;overflow-y:auto;}
.player-row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid rgba(255,255,255,0.04);cursor:grab;transition:background 0.15s;user-select:none;}
.player-row:last-child{border-bottom:none;}
.player-row:active{cursor:grabbing;}
.player-row.dragging{background:rgba(0,168,156,0.12);border:1px solid var(--teal);border-radius:3px;opacity:0.8;}
.player-row.drag-over{border-top:2px solid var(--gold);}
.rank-num{font-family:'Anton',sans-serif;font-size:16px;color:var(--orange2);width:32px;flex-shrink:0;text-align:right;}
.rank-num.top3{color:var(--gold);}
.drag-handle{color:var(--muted);font-size:14px;flex-shrink:0;cursor:grab;}
.pos-badge{font-family:'Anton',sans-serif;font-size:11px;padding:2px 6px;border-radius:2px;flex-shrink:0;min-width:28px;text-align:center;}
.pos-QB{background:rgba(229,196,64,0.15);color:#e5c440;}
.pos-RB{background:rgba(74,224,160,0.15);color:#4ae0a0;}
.pos-WR{background:rgba(74,176,255,0.15);color:#4ab0ff;}
.pos-TE{background:rgba(255,140,74,0.15);color:#ff8c4a;}
.pos-K{background:rgba(192,132,252,0.15);color:#c084fc;}
.pos-DEF{background:rgba(248,113,113,0.15);color:#f87171;}
.player-name{font-weight:600;font-size:14px;color:var(--chrome2);flex:1;}
.player-team{font-size:11px;color:var(--muted);letter-spacing:1px;}
.baseline-val{font-size:11px;color:var(--muted);letter-spacing:1px;width:40px;text-align:right;flex-shrink:0;}
.move-btns{display:flex;flex-direction:column;gap:2px;flex-shrink:0;}
.move-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;padding:1px 4px;line-height:1;}
.move-btn:hover{color:var(--teal2);}

/* SUBMIT */
.submit-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(10,21,32,0.97);border-top:1px solid var(--border-teal);padding:12px 20px;display:flex;align-items:center;gap:12px;z-index:50;backdrop-filter:blur(10px);}
.submit-info{flex:1;font-size:12px;color:var(--muted);letter-spacing:1px;}
.submit-info strong{color:var(--chrome2);}
.btn-submit{padding:12px 28px;background:var(--teal-dark);border:1px solid var(--teal);border-radius:3px;color:var(--chrome2);font-family:'Anton',sans-serif;font-size:15px;letter-spacing:3px;cursor:pointer;transition:all 0.2s;}
.btn-submit:hover{background:rgba(0,168,156,0.3);}
.btn-submit:disabled{opacity:0.4;cursor:not-allowed;}
.btn-reset{padding:12px 16px;background:transparent;border:1px solid var(--border-teal);border-radius:3px;color:var(--muted);font-family:'Anton',sans-serif;font-size:13px;letter-spacing:2px;cursor:pointer;}

/* TOAST */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#0d1a2b;border:1px solid var(--teal);border-radius:4px;padding:12px 24px;font-size:13px;color:var(--teal2);letter-spacing:1px;z-index:999;display:none;font-family:'Anton',sans-serif;}
.toast.error{border-color:#ff6060;color:#ff6060;}
</style>
</head>
<body>
<div class="frame-line frame-line-top"></div>
<div class="frame-line frame-line-bottom"></div>
<div class="toast" id="toast"></div>

<div class="container">
  <div class="nav"><a href="/rankings" class="nav-back">&#8249; League Rankings</a></div>
  <div class="header">
    <div class="header-eyebrow">League Consensus</div>
    <h1>SUBMIT YOUR RANKINGS</h1>
  </div>

  <!-- OWNER SELECT -->
  <div class="owner-section">
    <div class="section-title">1. SELECT YOUR TEAM</div>
    <div class="owner-grid" id="owner-grid"></div>
  </div>

  <!-- PLAYER RANKING -->
  <div class="filter-bar">
    <button class="filter-btn active" onclick="filterPos('ALL')" id="f-ALL">ALL</button>
    <button class="filter-btn" onclick="filterPos('QB')" id="f-QB">QB</button>
    <button class="filter-btn" onclick="filterPos('RB')" id="f-RB">RB</button>
    <button class="filter-btn" onclick="filterPos('WR')" id="f-WR">WR</button>
    <button class="filter-btn" onclick="filterPos('TE')" id="f-TE">TE</button>
    <input class="search-input" type="text" placeholder="Search player..." id="search-input" oninput="renderList()">
  </div>

  <div class="ranking-section">
    <div class="ranking-header">
      <div class="section-title" style="margin:0;">2. DRAG TO RERANK</div>
      <div class="ranking-count" id="ranking-count"></div>
    </div>
    <div class="ranking-list" id="ranking-list"></div>
  </div>
</div>

<!-- SUBMIT BAR -->
<div class="submit-bar">
  <div class="submit-info" id="submit-info">Select your team to submit</div>
  <button class="btn-reset" onclick="resetRankings()">↺ RESET</button>
  <button class="btn-submit" id="btn-submit" onclick="submitRankings()" disabled>SUBMIT</button>
</div>

let selectedOwner = null;
let rankings = BASELINE.map((p, i) => ({...p, rank: i+1}));
let activeFilter = 'ALL';
let dragSrcIdx = null;
let submittedOwners = new Set();

// Load submitted owners from Supabase
async function loadSubmitted() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/league_rankings?select=owner&order=submitted_at.desc`, {
      headers: {'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`}
    });
    const data = await res.json();
    submittedOwners = new Set(data.map(r => r.owner));
    renderOwners();
  } catch(e) { console.error(e); }
}

function renderOwners() {
  const grid = document.getElementById('owner-grid');
  grid.innerHTML = OWNERS.map(o => {
    const name = DISPLAY_NAMES[o] || o;
    const done = submittedOwners.has(o);
    const sel = selectedOwner === o;
    return `<button class="owner-btn ${sel?'selected':''} ${done?'submitted':''}"
      onclick="selectOwner('${o}')">${name}</button>`;
  }).join('');
}

function selectOwner(o) {
  selectedOwner = o;
  document.getElementById('btn-submit').disabled = false;
  document.getElementById('submit-info').innerHTML = `Submitting as <strong>${DISPLAY_NAMES[o]||o}</strong> · ${rankings.length} players ranked`;
  renderOwners();
}

function filterPos(pos) {
  activeFilter = pos;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('f-'+pos).classList.add('active');
  renderList();
}

function getVisible() {
  const q = document.getElementById('search-input').value.toLowerCase();
  return rankings.filter(p => {
    const posOk = activeFilter === 'ALL' || p.pos === activeFilter;
    const searchOk = !q || p.name.toLowerCase().includes(q) || p.team.toLowerCase().includes(q);
    return posOk && searchOk;
  });
}

function renderList() {
  const visible = getVisible();
  const list = document.getElementById('ranking-list');
  document.getElementById('ranking-count').textContent = `${visible.length} players`;

  list.innerHTML = visible.map((p, vi) => {
    const globalRank = p.rank;
    const topClass = globalRank <= 3 ? 'top3' : '';
    return `<div class="player-row" draggable="true"
        data-name="${p.name}"
        ondragstart="dragStart(event,'${p.name}')"
        ondragover="dragOver(event)"
        ondrop="drop(event,'${p.name}')"
        ondragend="dragEnd(event)"
        id="row-${p.name.replace(/[^a-z0-9]/gi,'_')}">
      <div class="rank-num ${topClass}">${globalRank}</div>
      <div class="drag-handle">&#8597;</div>
      <div class="pos-badge pos-${p.pos}">${p.pos}</div>
      <div class="player-name">${p.name}</div>
      <div class="player-team">${p.team}</div>
      <div class="baseline-val" title="Draft Sharks value">${p.val}</div>
      <div class="move-btns">
        <button class="move-btn" onclick="movePlayer('${p.name}',-1)" title="Move up">▲</button>
        <button class="move-btn" onclick="movePlayer('${p.name}',1)" title="Move down">▼</button>
      </div>
    </div>`;
  }).join('');
}

// Drag and drop
function dragStart(e, name) {
  dragSrcIdx = rankings.findIndex(p => p.name === name);
  e.dataTransfer.effectAllowed = 'move';
  setTimeout(() => e.target.classList.add('dragging'), 0);
}
function dragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
  e.currentTarget.classList.add('drag-over');
}
function drop(e, name) {
  e.preventDefault();
  const targetIdx = rankings.findIndex(p => p.name === name);
  if (dragSrcIdx === null || dragSrcIdx === targetIdx) return;
  const [moved] = rankings.splice(dragSrcIdx, 1);
  rankings.splice(targetIdx, 0, moved);
  rerank();
  renderList();
}
function dragEnd(e) {
  document.querySelectorAll('.dragging,.drag-over').forEach(el => {
    el.classList.remove('dragging','drag-over');
  });
  dragSrcIdx = null;
}

// Move by button
function movePlayer(name, dir) {
  const idx = rankings.findIndex(p => p.name === name);
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= rankings.length) return;
  [rankings[idx], rankings[newIdx]] = [rankings[newIdx], rankings[idx]];
  rerank();
  renderList();
}

function rerank() {
  rankings.forEach((p, i) => p.rank = i + 1);
}

function resetRankings() {
  rankings = BASELINE.map((p, i) => ({...p, rank: i+1}));
  renderList();
  showToast('Rankings reset to Draft Sharks baseline');
}

async function submitRankings() {
  if (!selectedOwner) return;
  const btn = document.getElementById('btn-submit');
  btn.disabled = true; btn.textContent = 'SAVING...';

  try {
    // Delete existing rankings for this owner
    await fetch(`${SUPABASE_URL}/rest/v1/league_rankings?owner=eq.${encodeURIComponent(selectedOwner)}`, {
      method: 'DELETE',
      headers: {'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json'}
    });

    // Insert new rankings
    const rows = rankings.map(p => ({
      owner: selectedOwner,
      player_name: p.name,
      player_pos: p.pos,
      rank: p.rank
    }));

    // Batch insert in chunks of 50
    for (let i = 0; i < rows.length; i += 50) {
      const chunk = rows.slice(i, i+50);
      await fetch(`${SUPABASE_URL}/rest/v1/league_rankings`, {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify(chunk)
      });
    }

    submittedOwners.add(selectedOwner);
    renderOwners();
    showToast('Rankings submitted! ✓', false);
    btn.textContent = 'SUBMITTED ✓';
    setTimeout(() => { btn.textContent = 'SUBMIT'; btn.disabled = false; }, 3000);
  } catch(e) {
    console.error(e);
    showToast('Error saving — try again', true);
    btn.textContent = 'SUBMIT'; btn.disabled = false;
  }
}

function showToast(msg, isError=false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isError?' error':'');
  t.style.display = 'block';
  setTimeout(() => t.style.display='none', 3000);
}

// Init
loadSubmitted();
renderList();
</script>
